<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrackerMaster — podgląd UI</title>
<style>
  body { margin: 0; font: 14px/1.5 'Segoe UI', system-ui, sans-serif; background: #F6F7F4; color: #102B34; }
  header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #D8E4E2; }
  header strong { font-size: 18px; }
  header p { margin: 4px 0 0; color: #4A6266; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px; }
  nav a { padding: 8px 12px; border: 1px solid #326E71; border-radius: 8px; color: #326E71; text-decoration: none; font-weight: 600; }
  nav a[aria-current] { background: #326E71; color: #fff; }
  main { display: flex; flex-wrap: wrap; gap: 24px; padding: 0 24px 24px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-weight: 600; margin-bottom: 6px; }
  iframe { border: 1px solid #C7D3D1; border-radius: 6px; background: #fff; display: block; }
  #widget { width: 440px; height: 76px; transition: height .15s; }
  #main { width: 1280px; height: 720px; }
  .note { color: #4A6266; font-size: 13px; max-width: 440px; }
</style>
</head>
<body>
<header>
  <strong>TrackerMaster — podgląd interfejsu (main)</strong>
  <p>Wersja wyłącznie do oceny wyglądu. Backend jest udawany, dane są fikcyjne i znikają po odświeżeniu. Nie testuje bazy, uśpienia, skrótu globalnego ani okien Windows.</p>
</header>
<nav id="scenarios"></nav>
<main>
  <figure>
    <figcaption>Mini widget (440×76 / 440×390 DIP)</figcaption>
    <iframe id="widget" title="Mini widget"></iframe>
    <p class="note">Rozwiń strzałką w widgecie. Start/Stop działa na danych podglądu.</p>
  </figure>
  <figure>
    <figcaption>Okno główne (1280×720)</figcaption>
    <iframe id="main" title="Okno główne"></iframe>
    <p class="note">Skala DPI: użyj powiększenia przeglądarki Ctrl + / Ctrl − (125% ≈ Ctrl + raz–dwa, 150% ≈ trzy razy).</p>
  </figure>
</main>
<script>
  const scenarios = { running: 'Pomiar w trakcie', idle: 'Brak pomiaru', recovered: 'Do weryfikacji (po zamknięciu procesu)', sleep: 'Niepewny czas po uśpieniu' };
  const current = new URLSearchParams(location.search).get('scenario') || 'running';
  const nav = document.getElementById('scenarios');
  for (const [key, label] of Object.entries(scenarios)) {
    const a = document.createElement('a'); a.href = '?scenario=' + key; a.textContent = label;
    if (key === current) a.setAttribute('aria-current', 'page');
    nav.append(a);
  }
  document.getElementById('widget').src = '/index.html?window=widget&scenario=' + current;
  document.getElementById('main').src = '/index.html?scenario=' + current;
  addEventListener('message', e => { if (e.data?.type === 'tm-preview-widget') document.getElementById('widget').style.height = e.data.expanded ? '390px' : '76px'; });
</script>
</body>
</html>
