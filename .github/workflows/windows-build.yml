name: Windows test build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked SQLite data files
        shell: pwsh
        run: |
          $databaseFiles = @(git ls-files | Where-Object { $_ -match '(?i)\.(?:db|sqlite3?)(?:-(?:wal|shm|journal)|\.partial)?$' })
          if ($databaseFiles.Count -gt 0) {
            $databaseFiles | ForEach-Object { Write-Host "Tracked database file: $_" }
            throw 'Refusing to build a commit containing SQLite database files.'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check frontend
        run: npm run build
      - name: Check report calculations
        run: node --test tests/reportTime.test.ts tests/reportClientFilter.test.ts tests/reportPresets.test.ts tests/reportFilterStorage.test.ts tests/reportCsv.test.ts tests/shortcut.test.ts tests/localDateTime.test.ts tests/sleepPeriods.test.mjs tests/sleepTime.test.ts tests/entryDraft.test.ts tests/clientLabels.test.ts tests/reportRefresh.test.mjs
      - name: Check mini timer model and keyboard transitions
        run: node --test tests/miniTimer.test.ts
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build isolated Windows test executable
        env:
          VITE_TRACKER_TEST_MODE: '1'
        run: npm run tauri -- build --no-bundle --config src-tauri/tauri.isolated.conf.json
      - name: Check isolated test data location
        shell: pwsh
        run: |
          $testDb = Join-Path $env:APPDATA 'pl.tracker.personal.testonly\tracker.sqlite3'
          $normalDb = Join-Path $env:APPDATA 'pl.tracker.personal\tracker.sqlite3'
          if ((Test-Path -LiteralPath $testDb) -or (Test-Path -LiteralPath $normalDb)) { throw 'Runner profile is not empty.' }
          $exe = Join-Path $PWD 'src-tauri\target\release\tracker-master.exe'
          $process = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Test application exited: $($process.ExitCode)" }
              if (Test-Path -LiteralPath $testDb) { break }
              Start-Sleep -Seconds 1
            }
            if (!(Test-Path -LiteralPath $testDb)) { throw 'Test database was not created in the isolated profile.' }
            if (Test-Path -LiteralPath $normalDb) { throw 'Test application touched the normal profile.' }
          } finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Save isolated unsigned test build
        uses: actions/upload-artifact@v4
        with:
          name: TrackerMaster-Windows-isolated-unsigned-test
          path: src-tauri/target/release/tracker-master.exe
          if-no-files-found: error
          retention-days: 7
      - name: Build unsigned test MSIX
        shell: pwsh
        run: |
          $exe = './src-tauri/target/release/tracker-master.exe'
          ./packaging/msix/New-TestMsix.ps1 -Executable $exe -Output ./TrackerMaster-test-x64.msix
          ./packaging/msix/New-TestMsix.ps1 -Executable $exe -Output ./TrackerMaster-test-update-x64.msix -Version 0.1.0.1
      - name: Save unsigned test MSIX
        uses: actions/upload-artifact@v4
        with:
          name: TrackerMaster-Windows-isolated-test-msix-unsigned
          path: |
            TrackerMaster-test-x64.msix
            TrackerMaster-test-update-x64.msix
          if-no-files-found: error
          retention-days: 7
  windows-application:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: TrackerMaster-Windows-isolated-unsigned-test
          path: src-tauri/target/release
      - name: Verify isolated Windows application and CSV
        run: node tests/windows-application.mjs
  msix-lifecycle:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: TrackerMaster-Windows-isolated-test-msix-unsigned
          path: msix-lifecycle-input
      - name: Verify packaged application and data retention
        shell: powershell
        run: >
          ./packaging/msix/Test-TestMsixLifecycle.ps1
          -InitialPackage ./msix-lifecycle-input/TrackerMaster-test-x64.msix
          -UpdatedPackage ./msix-lifecycle-input/TrackerMaster-test-update-x64.msix
