name: Windows test build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked SQLite data files
        shell: pwsh
        run: |
          $databaseFiles = @(git ls-files | Where-Object { $_ -match '(?i)\.(?:db|sqlite3?)(?:-(?:wal|shm|journal)|\.partial)?$' })
          if ($databaseFiles.Count -gt 0) {
            $databaseFiles | ForEach-Object { Write-Host "Tracked database file: $_" }
            throw 'Refusing to build a commit containing SQLite database files.'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check frontend
        run: npm run build
      - name: Check report calculations
        run: node --test tests/reportTime.test.ts tests/reportClientFilter.test.ts tests/reportPresets.test.ts tests/reportFilterStorage.test.ts tests/reportCsv.test.ts tests/shortcut.test.ts tests/localDateTime.test.ts tests/messageText.test.ts tests/reportGlance.test.ts tests/historyFormat.test.ts tests/calendarModel.test.ts tests/calendarEntry.test.ts tests/reportDay.test.ts tests/timerChoice.test.ts tests/plural.test.ts tests/sleepPeriods.test.mjs tests/sleepTime.test.ts tests/entryDraft.test.ts tests/clientLabels.test.ts tests/reportRefresh.test.mjs
      - name: Check mini timer model and keyboard transitions
        run: node --test tests/miniTimer.test.ts
      - name: Check UI design tokens, contrast and font sizes
        run: node --test tests/designTokens.test.mjs tests/previewIsolation.test.mjs
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build isolated Windows test executable
        env:
          VITE_TRACKER_TEST_MODE: '1'
        run: npm run tauri -- build --no-bundle --config src-tauri/tauri.isolated.conf.json
      - name: Check isolated test data location
        shell: pwsh
        run: |
          $testDb = Join-Path $env:APPDATA 'pl.tracker.personal.testonly\tracker.sqlite3'
          $normalDb = Join-Path $env:APPDATA 'pl.tracker.personal\tracker.sqlite3'
          if ((Test-Path -LiteralPath $testDb) -or (Test-Path -LiteralPath $normalDb)) { throw 'Runner profile is not empty.' }
          $exe = Join-Path $PWD 'src-tauri\target\release\tracker-master.exe'
          $process = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Test application exited: $($process.ExitCode)" }
              if (Test-Path -LiteralPath $testDb) { break }
              Start-Sleep -Seconds 1
            }
            if (!(Test-Path -LiteralPath $testDb)) { throw 'Test database was not created in the isolated profile.' }
            if (Test-Path -LiteralPath $normalDb) { throw 'Test application touched the normal profile.' }
          } finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Save isolated unsigned test build
        uses: actions/upload-artifact@v4
        with:
          name: TrackerMaster-Windows-isolated-unsigned-test
          path: src-tauri/target/release/tracker-master.exe
          if-no-files-found: error
          retention-days: 7
      - name: Build unsigned test MSIX
        shell: pwsh
        run: |
          $exe = './src-tauri/target/release/tracker-master.exe'
          ./packaging/msix/New-TestMsix.ps1 -Executable $exe -Output ./TrackerMaster-test-x64.msix
          ./packaging/msix/New-TestMsix.ps1 -Executable $exe -Output ./TrackerMaster-test-update-x64.msix -Version 0.1.0.1
      - name: Save unsigned test MSIX
        uses: actions/upload-artifact@v4
        with:
          name: TrackerMaster-Windows-isolated-test-msix-unsigned
          path: |
            TrackerMaster-test-x64.msix
            TrackerMaster-test-update-x64.msix
          if-no-files-found: error
          retention-days: 7
      # D11 Store variant: on a PR only the manifest is compared (no package with the Store identity is built
      # here; the candidate comes from windows-msix-store.yml, workflow_dispatch on main).
      - name: Check Store manifest equals the tested manifest
        shell: pwsh
        run: ./packaging/msix/Test-MsixManifestParity.ps1
      # Runs last: it replaces the isolated executable in target/release (already saved above).
      - name: Refuse to package a production build (MSIX isolation guard)
        shell: pwsh
        run: |
          # Production identifier and no VITE_TRACKER_TEST_MODE. The build is never started, so the
          # pl.tracker.personal profile is not touched.
          npm run tauri -- build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Production build failed ($LASTEXITCODE)." }
          $exe = './src-tauri/target/release/tracker-master.exe'
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($exe))
          if (!$text.Contains('TRACKERMASTER_BUILD_PROFILE=production;') -or $text.Contains('TRACKERMASTER_BUILD_PROFILE=testonly;')) {
            throw 'The production build does not carry the production build profile marker.'
          }
          foreach ($variant in 'Test', 'Store') {
            $output = "./production-must-fail-$variant.msix"
            $refused = $null
            try { ./packaging/msix/New-TestMsix.ps1 -Variant $variant -Executable $exe -Output $output | Out-Null }
            catch { $refused = $_.Exception.Message }
            if (!$refused -or $refused -notmatch 'not the isolated test build' -or (Test-Path -LiteralPath $output)) {
              throw "Packaging a production build ($variant) did not fail on the isolation check: $refused"
            }
            Write-Host "PASS: $variant packaging refused the production build: $refused"
          }
          if (Test-Path -LiteralPath (Join-Path $env:APPDATA 'pl.tracker.personal')) { throw 'The pl.tracker.personal profile was touched.' }
  windows-application:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: TrackerMaster-Windows-isolated-unsigned-test
          path: src-tauri/target/release
      - name: Verify isolated Windows application and CSV
        run: node tests/windows-application.mjs
      - name: Release the PTT-36 T27 test disk if a run was interrupted
        # The E2E detaches its VHD and restores the test profile in `finally`; this only
        # covers a killed process. It touches nothing but the T27 VHD and the test profile.
        if: always()
        shell: pwsh
        run: |
          $profile = Join-Path $env:APPDATA 'pl.tracker.personal.testonly'
          $item = Get-Item -LiteralPath $profile -Force -ErrorAction SilentlyContinue
          if ($item -and $item.LinkType -eq 'Junction') {
            [System.IO.Directory]::Delete($profile)
            Rename-Item -LiteralPath "$profile.before-disk-full" -NewName 'pl.tracker.personal.testonly'
            Write-Host 'Restored the test profile directory after an interrupted T27 run.'
          }
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'trackermaster-disk-full-*.vhdx' -ErrorAction SilentlyContinue | ForEach-Object {
            Dismount-DiskImage -ImagePath $_.FullName -ErrorAction SilentlyContinue | Out-Null
            Remove-Item -LiteralPath $_.FullName -Force
            Write-Host "Released leftover test disk $($_.Name)."
          }
      - name: Verify file protection and second-account isolation (DEV-14)
        # Collect DEV-14 evidence even when an earlier E2E step failed; the job still fails.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/windows-file-protection.ps1 -Mode Unpackaged
      - name: Save UI layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrackerMaster-UI-screenshots
          path: test-results/ui-screenshots
          if-no-files-found: warn
          retention-days: 14
  msix-lifecycle:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: TrackerMaster-Windows-isolated-test-msix-unsigned
          path: msix-lifecycle-input
      - name: Verify packaged application and data retention
        shell: powershell
        run: >
          ./packaging/msix/Test-TestMsixLifecycle.ps1
          -InitialPackage ./msix-lifecycle-input/TrackerMaster-test-x64.msix
          -UpdatedPackage ./msix-lifecycle-input/TrackerMaster-test-update-x64.msix
      - name: Verify packaged file protection (DEV-14)
        shell: pwsh
        run: ./tests/windows-file-protection.ps1 -Mode Packaged
